<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ content.label|default:"Kiosk media" }}</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #000;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .content-media {
        display: block;
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
      }
    </style>
  </head>
  <body>
    {% if media_kind == "video" %}
    <video
      class="content-media content-video"
      autoplay
      muted
      playsinline
      preload="auto"
      aria-label="{{ content.label|default:'Kiosk video' }}"
    >
      <source src="{{ media_url }}" type="{{ media_type }}" />
    </video>
    {% else %}
    <img
      class="content-media content-image"
      src="{{ media_url }}"
      alt="{{ content.label|default:'Kiosk image' }}"
    />
    {% endif %}
  </body>
</html>
