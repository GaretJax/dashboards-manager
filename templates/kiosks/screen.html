{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ screen.name }}</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      #screen-frame {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      #screen-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        color: #ddd;
        text-align: center;
        pointer-events: none;
      }

      #screen-status[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <iframe
      id="screen-frame"
      title="{{ screen.name }}"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade"
    ></iframe>
    <div id="screen-status">Loading screen configuration…</div>
    <div id="screen-config" data-url="{{ config_url }}"></div>
    <script src="{% static 'kiosks/screen.js' %}" defer></script>
  </body>
</html>
