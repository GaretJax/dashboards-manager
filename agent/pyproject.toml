[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kiosk-agent"
version = "0.2.0"
description = "Chromium kiosk agent for Kiosk Manager"
requires-python = ">=3.11"
dependencies = [
  "attrs>=23,<26",
  "click>=8.1,<9",
  "httpx>=0.27,<1",
  "packaging>=24,<26",
  "platformdirs>=4,<5",
  "python-dateutil>=2.9,<3",
  "websocket-client>=1.8,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kiosk_agent"]

[project.scripts]
kiosk-agent = "kiosk_agent.cli:main"

[dependency-groups]
lint = ["pyright", "ruff>=0.9,<1"]
test = ["pytest>=8,<9", "pytest-cov>=5,<7"]
dev = [{ include-group = "lint" }, { include-group = "test" }]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "off"
reportUndefinedVariable = "error"
reportUnboundVariable = "error"
reportPossiblyUnboundVariable = "warning"
reportPrivateUsage = "warning"
reportUnusedImport = "warning"
reportUnusedVariable = "none"
reportMissingImports = "warning"
venvPath = "."
venv = ".venv"
extraPaths = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "PERF",
  "PIE",
  "PT",
  "RUF",
  "S",
  "SIM",
  "UP",
  "W",
]
ignore = ["E501", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["kiosk_agent"]
